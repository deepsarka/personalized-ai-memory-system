version: "3.9"

services:
  # Graph memory store — temporal facts, entities, relationships (Stage 3 of lifecycle)
  # Also provides the built-in vector index for semantic retrieval (Stage 4), so we
  # don't need a separate Qdrant service.
  neo4j:
    image: neo4j:5-community
    container_name: memory-neo4j
    ports:
      - "7474:7474"   # Browser console: http://localhost:7474
      - "7687:7687"   # Bolt driver port (used by the Python neo4j driver)
    environment:
      - NEO4J_AUTH=neo4j/testpassword123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Event transport — durable queue for interaction events (Stage 1: Capture and authorize)
  # Redpanda is Kafka-API-compatible but a single lightweight container (no ZooKeeper).
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: memory-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"   # Kafka-compatible API

  # Operational store — consent state, ingestion status, tool audit, feedback, deletion jobs
  postgres:
    image: postgres:16-alpine
    container_name: memory-postgres
    environment:
      - POSTGRES_USER=memory_admin
      - POSTGRES_PASSWORD=devpassword123
      - POSTGRES_DB=memory_ops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_admin -d memory_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache — short-lived subject-scoped caching, rate limiting, idempotency support
  # Valkey is the open-source, license-free fork of Redis (drop-in compatible).
  valkey:
    image: valkey/valkey:7-alpine
    container_name: memory-valkey
    ports:
      - "6379:6379"

  # Backend API — FastAPI app (ingestion, retrieval, chat, MCP server).
  # Runs alembic migrations then starts uvicorn (see Dockerfile).
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memory-api
    env_file:
      - .env
    environment:
      # Override host-facing values from .env with in-network service
      # names, since containers reach each other by service name, not
      # localhost, once everything runs under compose.
      - NEO4J_URI=bolt://neo4j:7687
      - POSTGRES_URL=postgresql://memory_admin:devpassword123@postgres:5432/memory_ops
      - CACHE_URL=redis://valkey:6379/0
      - REDPANDA_BOOTSTRAP_SERVERS=redpanda:9092
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      valkey:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Frontend — Streamlit UI, talks to the api service over the compose network.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: memory-frontend
    environment:
      - API_BASE_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  postgres_data:
