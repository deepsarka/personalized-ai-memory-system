services:
  # Graph memory store
  neo4j:
    image: neo4j:5-community
    container_name: memory-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/testpassword123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Event transport
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: memory-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Operational store
  postgres:
    image: postgres:16-alpine
    container_name: memory-postgres
    environment:
      - POSTGRES_USER=memory_admin
      - POSTGRES_PASSWORD=devpassword123
      - POSTGRES_DB=memory_ops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_admin -d memory_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache
  valkey:
    image: valkey/valkey:7-alpine
    container_name: memory-valkey
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memory-api
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - POSTGRES_URL=postgresql://spotify_0ix0_user:f36ytJBF3IovKD7tFA1j3sL60nQrXdEg@dpg-daffgeon74is739q0ec0-a.oregon-postgres.render.com/spotify_0ix0
      - CACHE_URL=redis://valkey:6379/0
      - REDPANDA_BOOTSTRAP_SERVERS=redpanda:9092
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      valkey:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Main frontend — Vite React app
  frontend:
    build:
      context: ../spotify-ai-frontend
      dockerfile: frontend.Dockerfile
    container_name: memory-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  postgres_data: